[package]
name = "soccar-simulation"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libm = "=0.2.15"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[profile.release]
codegen-units = 1
lto = "thin"
