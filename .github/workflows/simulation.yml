name: Simulation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: npm test
      - run: npm run test:rust
      - run: npm run test:cli
      - run: npm run test:simulation:full
      - run: npm run test:simulation -- --debug
      - run: npm run test:presentation
      - run: npm run build
      - run: npm run test:browser -- --preview
      - run: cargo fmt --manifest-path simulation/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path simulation/Cargo.toml --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-reports-${{ matrix.os }}
          path: |
            artifacts/simulation/
            artifacts/presentation/
            artifacts/browser/
          if-no-files-found: ignore
